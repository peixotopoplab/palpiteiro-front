<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A2220"/>
  <!-- Accent bar top -->
  <rect width="1200" height="4" fill="#30B070"/>
  
  <!-- Logo area - four leaf clover shape -->
  <g transform="translate(140, 200)">
    <!-- Leaf top -->
    <ellipse cx="60" cy="30" rx="28" ry="28" fill="#30B070" opacity="0.9"/>
    <!-- Leaf right -->
    <ellipse cx="90" cy="60" rx="28" ry="28" fill="#30B070" opacity="0.9"/>
    <!-- Leaf bottom -->
    <ellipse cx="60" cy="90" rx="28" ry="28" fill="#30B070" opacity="0.9"/>
    <!-- Leaf left -->
    <ellipse cx="30" cy="60" rx="28" ry="28" fill="#30B070" opacity="0.9"/>
    <!-- Center -->
    <ellipse cx="60" cy="60" rx="18" ry="18" fill="#1E6B45"/>
    <!-- Stem -->
    <rect x="56" y="108" width="8" height="32" rx="4" fill="#30B070" opacity="0.7"/>
    <!-- P letter -->
    <text x="60" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#EDF2EE">P</text>
  </g>

  <!-- Main title -->
  <text x="280" y="265" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#EDF2EE">Palpiteiro</text>
  
  <!-- Subtitle -->
  <text x="280" y="330" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#9BAFA4">Análises estatísticas da Loteca</text>

  <!-- Description line -->
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="24" fill="#6B8A7A">Probabilidades · Secas · Duplos · Triplos</text>

  <!-- VIP badge -->
  <rect x="280" y="420" width="140" height="40" rx="8" fill="#D4AF37" opacity="0.15"/>
  <rect x="280" y="420" width="140" height="40" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="350" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#D4AF37">Acesso VIP</text>

  <!-- Free badge -->
  <rect x="436" y="420" width="140" height="40" rx="8" fill="#30B070" opacity="0.15"/>
  <rect x="436" y="420" width="140" height="40" rx="8" fill="none" stroke="#30B070" stroke-width="1.5"/>
  <text x="506" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#30B070">Plano Free</text>

  <!-- Bottom accent -->
  <rect x="280" y="510" width="640" height="1" fill="#2C3830"/>
  <text x="280" y="545" font-family="Arial, sans-serif" font-size="18" fill="#4A6055">palpiteiro-front.vercel.app</text>
  
  <!-- Decorative grid lines -->
  <line x1="900" y1="0" x2="900" y2="630" stroke="#2C3830" stroke-width="1"/>
  <text x="1000" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="100" fill="#222B27" font-weight="700">🍀</text>
  <text x="1000" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#374840" font-weight="500">Concurso</text>
  <text x="1000" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#374840" font-weight="500">da Loteca</text>
</svg>